<!DOCTYPE html>
<html>
<head>
<title>HACKED BY SIGUI YOHAN</title>
</head>
<body>
<div class="glitch-wrapper">
  <div class="hacker-container">
    
    <!-- YOUR IMAGE GOES HERE -->
    <div class="text-box-wrapper">
      <span class="bracket">[</span>
      <div class="glitch-box">
        <div class="sub-text">SIGUI YOHAN</div>
        <div class="glitch" data-text="HACKED YOU !">HACKED YOU !</div>
      </div>
      <span class="bracket">]</span>
    </div>
    
  </div>
</div>

<style>
/* Full Screen for Google Sites */
html, body {
  margin: 0 !important;
  padding: 0 !important;
  width: 100% !important;
  height: 100% !important;
  background-color: #0b1a0e !important;
  overflow: hidden !important;
  position: fixed !important;
  top: 0;
  left: 0;
}

.glitch-wrapper {
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  width: 100vw !important;
  height: 100vh !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  background-color: #0b1a0e !important;
  z-index: 999999 !important;
  animation: bg-flash 2.8s infinite steps(1);
}

/* Stack the image and the bracketed text vertically */
.hacker-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: 'Courier New', Courier, monospace;
}

/* Style and animate the image */
.hacker-image {
  width: 150px; /* Adjust size here */
  height: auto;
  margin-bottom: 30px;
  filter: sepia(1) saturate(5) hue-rotate(70deg); /* Forces most images to turn green like the text! */
  animation: image-glitch 2.8s infinite linear;
}

.text-box-wrapper {
  display: flex;
  align-items: center;
  justify-content: center;
}

.glitch-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin: 0 20px;
}

.bracket {
  color: #79c843;
  font-size: 10vw;
  font-weight: 300;
  line-height: 1;
  animation: bracket-shake 2.8s infinite linear;
}

.sub-text {
  color: #79c843;
  font-size: 3.5vw;
  font-weight: bold;
  letter-spacing: 4px;
  text-transform: uppercase;
  animation: sub-glitch 2.8s infinite linear;
}

.glitch {
  position: relative;
  color: #79c843; 
  font-size: 7.5vw;
  font-weight: 900;
  letter-spacing: 5px;
  text-transform: uppercase;
  animation: bzip-glitch 2.8s infinite linear;
}

.glitch::before,
.glitch::after {
  content: attr(data-text);
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #0b1a0e;
}

.glitch::before {
  left: 3px;
  text-shadow: -2px 0 #ffffff;
  clip-path: inset(40% 0 30% 0);
  animation: slice-bug 0.4s infinite linear alternate-reverse;
  opacity: 0;
}

.glitch::after {
  left: -3px;
  text-shadow: -3px 0 #00FF00;
  clip-path: inset(10% 0 75% 0);
  animation: slice-bug 0.3s infinite linear alternate;
  opacity: 0;
}

/* Image specific glitch: shrinks, shakes, and turns white during bzip */
@keyframes image-glitch {
  0%, 65% { transform: scale(1) skew(0deg); filter: sepia(1) saturate(5) hue-rotate(70deg) invert(0); }
  67% { transform: scale(1.3, 0.3) skew(10deg); filter: invert(1); }
  69% { transform: scale(0.7, 1.5) skew(-10deg); }
  71%, 78% { transform: scale(1) skew(0deg); filter: sepia(1) saturate(5) hue-rotate(70deg) invert(0); }
  80% { transform: scale(1, 0.1); filter: invert(1); }
  82% { transform: scale(1.2, 1); }
  84%, 100% { transform: scale(1) skew(0deg); filter: sepia(1) saturate(5) hue-rotate(70deg) invert(0); }
}

@keyframes bzip-glitch {
  0%, 65% { transform: skew(0deg) scaleY(1); opacity: 1; }
  67% { transform: skew(15deg) scaleY(0.2) scaleX(1.3); color: #ffffff; }
  69% { transform: skew(-20deg) scaleY(1.7) scaleX(0.8); color: #79c843; }
  71%, 78% { transform: skew(0deg) scaleY(1) scaleX(1); color: #79c843; }
  80% { transform: skew(-25deg) scaleY(0.1); color: #ffffff; }
  82% { transform: skew(0deg) scaleY(1.2); opacity: 0.8; }
  84%, 100% { transform: skew(0deg) scaleY(1) scaleX(1); opacity: 1; }
}

@keyframes slice-bug {
  0%, 65% { opacity: 0; }
  66%, 70% { opacity: 1; }
  71%, 79% { opacity: 0; }
  80%, 83% { opacity: 1; }
  84%, 100% { opacity: 0; }
}

@keyframes sub-glitch {
  0%, 65% { transform: translate(0); }
  67% { transform: translate(-5px, 2px); color: #ffffff; }
  69% { transform: translate(5px, -2px); }
  71%, 100% { transform: translate(0); color: #79c843; }
}

@keyframes bracket-shake {
  0%, 65% { transform: translateX(0); }
  67% { transform: translateX(-10px) scaleX(1.2); }
  69% { transform: translateX(8px); }
  71%, 78% { transform: translateX(0); }
  80% { transform: translateX(15px) scaleY(0.6); }
  82% { transform: translateX(0); }
}

@keyframes bg-flash {
  0%, 65% { background-color: #0b1a0e; }
  67% { background-color: #ffffff; } 
  69% { background-color: #000000; } 
  71%, 78% { background-color: #0b1a0e; }
  80% { background-color: #ffffff; } 
  82% { background-color: #000000; }
  84% { background-color: #0b1a0e; }
}
</style>

</body>
</html>
